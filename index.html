const KEY="du-science-04-standalone-v1", PERIOD=45*60*1000;

const bn=n=>Number(n).toLocaleString("bn-BD",{useGrouping:false});

function warn(message){$("warning").textContent=message}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));warn("");return true}

function startPage(){

    const name=$("student").value.trim(),id=$("roll").value.trim();

    const now=Date.now();
    state={attemptId:crypto.randomUUID?.()||now+"-"+Math.random().toString(36).slice(2),name,id,start:now,end:now+PERIOD,stage:"mcq",choices:Array(60).fill(null),writing:papers.map(()=>({text:"",photo:null})),marks:Array(8).fill(null),delivery:"pending"};

function scores(){
  const subjects=SUBJECTS.map((subject,s)=>{
    let correct=0,wrong=0,blank=0;
    questions.slice(s*15,s*15+15).forEach((q,j)=>{
      const a=state.choices[s*15+j];
      if(a===null)blank++;else if(a===q.key)correct++;else wrong++;
    });
    return {subject,correct,wrong,blank,score:correct-wrong/4};
  });
  const sum=k=>subjects.reduce((v,s)=>v+s[k],0);
  return {correct:sum("correct"),wrong:sum("wrong"),blank:sum("blank"),mcqScore:sum("score"),mcqMax:60,writtenScore:null,writtenMax:40,totalScore:null,totalMax:100,subjects};
}
function payload(){
  const results=scores();
  return {status:"Submitted",exam:"Model Test 04",attemptId:state.attemptId,name:state.name,id:state.id,
    studentName:state.name,studentId:state.id,studentID:state.id,
    totalQuestions:questions.length,score:results.mcqScore,results,startedAt:new Date(state.start).toISOString(),
    writtenStartedAt:new Date(state.writtenAt).toISOString(),submittedAt:new Date(state.finished).toISOString(),reason:state.reason,
    answers:{mcq:Object.fromEntries(state.choices.map((a,i)=>["Q"+(i+1),a===null?null:{option:letters[a],text:questions[i].options[a]}])),
      written:Object.fromEntries(state.writing.map((a,i)=>["W"+(i+1),{text:a.text,photo:a.photo}]))}};
}
function openWritten(at){
  state.stage="written";state.writtenAt=at;state.end=at+PERIOD;save();
}
function finish(at,reason){
  if(state.stage!=="written")return;
  state.stage="done";state.finished=at;state.reason=reason;
  save();render();window.scrollTo(0,0);void send();
}
function tick(){
  if(!state||state.stage==="done")return;
  const now=Date.now();
  if(state.stage==="mcq"&&now>=state.end){openWritten(state.end);render();window.scrollTo(0,0)}
  if(state.stage==="written"&&now>=state.end){finish(state.end,"timeout");return}
  const s=Math.max(0,Math.ceil((state.end-now)/1000));
  $("clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function active(stage){tick();return state?.stage===stage}
function nav(){return '<nav>'+SUBJECTS.map((s,i)=>'<a href="#sub'+i+'">'+s+'</a>').join("")+'</nav>'}

    out+='<h2 id="sub'+s+'">'+subject+'</h2>';

      questions.slice(s*15,s*15+15).forEach((q,j)=>{
        const i=s*15+j;
        out+='<article><b>'+bn(i+1)+'. '+escapeHTML(q.stem)+'</b>'+q.options.map((opt,k)=>'<label class="option"><input type="radio" name="q'+i+'" data-q="'+i+'" value="'+k+'" '+(state.choices[i]===k?"checked":"")+'> '+letters[k]+'. '+escapeHTML(opt)+'</label>').join("")+'<button class="secondary" data-clear="'+i+'">উত্তর মুছুন</button></article>';
      });
    }else{
      papers.slice(s*2,s*2+2).forEach(([q],j)=>{
        const i=s*2+j,a=state.writing[i];
        out+='<article><b>'+bn(i+1)+'. '+q+'</b><label>লিখিত উত্তর<textarea maxlength="5000" data-text="'+i+'">'+escapeHTML(a.text)+'</textarea></label><label>খাতার ছবি <input type="file" accept="image/*" data-photo="'+i+'"></label><label>ক্যামেরায় তুলুন <input type="file" accept="image/*" capture="environment" data-photo="'+i+'"></label><div id="preview'+i+'"></div><button class="secondary" data-remove="'+i+'">ছবি সরান</button></article>';
      });
    }
  });
  app.innerHTML=out+'<button id="submit">'+(isMCQ?"MCQ জমা দিয়ে লিখিত শুরু করুন":"Submit Exam · পরীক্ষা জমা দিন")+'</button>';
  if(isMCQ)progress();else{
    $("progress").textContent="প্রতি প্রশ্ন ৫ নম্বর। টাইপ করা উত্তর ও সংরক্ষিত ছবি দুটোই পাঠানো হবে।";
    papers.forEach((_,i)=>preview(i));
  }
  $("submit").onclick=()=>{
    const expected=isMCQ?"mcq":"written";
    if(!active(expected))return;
    if(photoBusy){warn("ছবিটি প্রস্তুত হচ্ছে। একটু অপেক্ষা করুন।");return}
    if(!confirm(isMCQ?"MCQ উত্তর লক করে লিখিত শুরু করবেন?":"সব উত্তর লক করে শিক্ষকের কাছে পাঠাবেন?"))return;
    if(!active(expected))return;
    if(isMCQ){openWritten(Date.now());render();tick();window.scrollTo(0,0)}
    else finish(Date.now(),"manual");
  };
}
function progress(){$("progress").textContent="উত্তর দেওয়া হয়েছে "+bn(state.choices.filter(a=>a!==null).length)+" / ৬০"}
function preview(i){
  const box=$("preview"+i);box.replaceChildren();
  if(!state.writing[i].photo)return;
  const img=new Image();img.alt="সংরক্ষিত উত্তর "+bn(i+1);img.src=state.writing[i].photo;box.append(img);
}
async function attach(i,file){
  if(!file||photoBusy||!active("written"))return;
  if(file.size>20*1024*1024){warn("২০ MB-এর ছোট ছবি দিন।");return}
  photoBusy=true;warn("ছবি প্রস্তুত হচ্ছে…");
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const scale=Math.min(1,1800/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext("2d");ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let data=canvas.toDataURL("image/jpeg",0.82);
    if(data.length>420000)data=canvas.toDataURL("image/jpeg",0.54);
    if(data.length>420000)throw Error("ছবিটি ক্রপ করে শুধু উত্তরের অংশ দিন।");
    if(!active("written"))return;
    const old=state.writing[i].photo;state.writing[i].photo=data;
    if(!save()){state.writing[i].photo=old;warn("ছবি সংরক্ষণ করা যায়নি। ছোট ছবি দিন।");return}
    preview(i);warn("ছবি সংরক্ষিত হয়েছে।");
  }catch(e){warn(e.message?.includes("ক্রপ")?e.message:"ছবি পড়া যায়নি। JPG বা PNG দিন।")}
  finally{photoBusy=false;URL.revokeObjectURL(url)}
}
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches("[data-text]")&&active("written")){state.writing[Number(t.dataset.text)].text=t.value;save()}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("[data-q]")&&active("mcq")){state.choices[Number(t.dataset.q)]=Number(t.value);save();progress()}
  if(t.matches("[data-photo]")){const file=t.files[0];t.value="";void attach(Number(t.dataset.photo),file)}
  if(t.matches("[data-mark]")&&state.stage==="done"){
    const i=Number(t.dataset.mark);
    if(!t.validity.valid){t.value=state.marks[i]??"";warn("০ থেকে ৫-এর মধ্যে ০.২৫ ধাপে নম্বর দিন।");return}
    state.marks[i]=t.value===""?null:Number(t.value);save();selfSummary();
  }
});
app.addEventListener("click",e=>{
  const t=e.target;
  if(t.matches("[data-clear]")&&active("mcq")){
    const i=Number(t.dataset.clear);state.choices[i]=null;
    app.querySelectorAll('[name="q'+i+'"]').forEach(r=>r.checked=false);save();progress();
  }
  if(t.matches("[data-remove]")&&!photoBusy&&active("written")){
    const i=Number(t.dataset.remove);state.writing[i].photo=null;save();preview(i);
  }
});
function selfSummary(){
  const count=state.marks.filter(n=>n!==null).length;
  const total=state.marks.reduce((v,n)=>v+(n??0),0);
  $("self").textContent="স্ব-মূল্যায়ন "+bn(count)+"/৮ · লিখিত "+bn(total)+"/৪০"+(count===8?" · মোট "+bn(scores().mcqScore+total)+"/১০০":"");
}
function resultPage(){
  const r=scores();
  app.innerHTML='<section><small>'+escapeHTML(state.name)+' · '+escapeHTML(state.id)+'</small><h1>ফলাফল</h1><h2>MCQ '+bn(r.mcqScore)+' / ৬০</h2><p>সঠিক '+bn(r.correct)+' · ভুল '+bn(r.wrong)+' · ফাঁকা '+bn(r.blank)+'</p><table><tr><th>বিষয়</th><th>MCQ / ১৫</th></tr>'+r.subjects.map(s=>'<tr><td>'+s.subject+'</td><td>'+bn(s.score)+'</td></tr>').join("")+'</table><div id="network" role="status"></div><p id="self"></p><small>লিখিত নম্বর নিজের অনুশীলনের জন্য এই ডিভাইসে থাকে।</small><div class="controls"><button onclick="window.print()">প্রিন্ট / PDF</button><button id="restart" class="secondary">নতুন প্রচেষ্টা</button></div></section><h2>বহুনির্বাচনি উত্তরপত্র</h2>'+questions.map((q,i)=>{
    const a=state.choices[i];
    return '<article><b>'+bn(i+1)+'. '+escapeHTML(q.stem)+'</b><p>আপনার উত্তর · '+(a===null?"ফাঁকা":letters[a]+'. '+escapeHTML(q.options[a]))+'</p><p><strong>সঠিক · '+letters[q.key]+'. '+escapeHTML(q.options[q.key])+'</strong></p><p>'+escapeHTML(q.why)+'</p></article>';
  }).join("")+'<h2>লিখিত উত্তরপত্র</h2>'+papers.map(([q,solution],i)=>'<article><b>'+bn(i+1)+'. '+q+'</b><p class="answer">'+escapeHTML(state.writing[i].text||"টাইপ করা উত্তর নেই।")+'</p><div id="preview'+i+'"></div><p><strong>মডেল সমাধান ও নম্বরবণ্টন</strong></p><p>'+solution+'</p><label>স্ব-মূল্যায়ন / ৫ <input type="number" min="0" max="5" step=".25" data-mark="'+i+'" value="'+(state.marks[i]??"")+'"></label></article>').join("");
  papers.forEach((_,i)=>preview(i));selfSummary();network();
  $("restart").onclick=()=>{
    if(sending||photoBusy)return;
    if(!confirm("এই ডিভাইসের আগের উত্তর ও ছবি মুছে নতুন পরীক্ষা শুরু করবেন?"))return;
    try{localStorage.removeItem(KEY)}catch{warn("ডিভাইস থেকে পুরোনো উত্তর মোছা যায়নি।");return}
    state=null;warn("");render();window.scrollTo(0,0);
  };
}
function network(){
  const box=$("network");if(!box)return;
  const sent=state.delivery==="sent";
  box.textContent=sending?"উত্তর পাঠানো হচ্ছে…":sent?"জমার অনুরোধ পাঠানো হয়েছে। শিটে সংরক্ষণ শিক্ষক যাচাই করতে পারবেন।":"জমার অনুরোধ অপেক্ষমাণ। সংযোগ থাকলে আবার পাঠান।";
  if(!sending&&!sent){
    const b=document.createElement("button");b.textContent="আবার পাঠান";b.onclick=send;box.append(b);
  }
  $("restart").disabled=sending||!sent;
}
let attendanceTask=null;
function sendAttendance(){
  if(!state||state.stage==="done"||state.attendanceSent)return Promise.resolve();
  if(attendanceTask)return attendanceTask;
  const attempt=state;
  const body={exam:"Model Test 04",status:"Started",attemptId:attempt.attemptId,
    startedAt:new Date(attempt.start).toISOString(),name:attempt.name,id:attempt.id,
    studentName:attempt.name,studentId:attempt.id,studentID:attempt.id,
    totalQuestions:60,score:null,answers:{}};
  attendanceTask=fetch(ENDPOINT,{method:"POST",mode:"no-cors",credentials:"omit",
    headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(body),
    signal:AbortSignal.timeout(20000)}).then(()=>{
      if(state===attempt){attempt.attendanceSent=true;save()}
    }).catch(()=>{}).finally(()=>{attendanceTask=null});
  return attendanceTask;
}
async function send(){
  if(!state||state.stage!=="done"||sending||state.delivery==="sent")return;
  sending=true;network();if(attendanceTask)await attendanceTask;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),45000);
  try{
    // A simple text/plain request carries JSON without a CORS preflight.
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload()),signal:controller.signal});
    state.delivery="sent";save();
  }catch{state.delivery="pending";save()}
  finally{clearTimeout(timeout);sending=false;network()}
}
function render(){
  $("clock").textContent="";
  if(!state)startPage();else if(state.stage==="done")resultPage();else examPage();
}
try{
  const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);
  render();tick();void sendAttendance();
  if(state?.stage==="done"&&state.delivery==="pending")void send();
}catch{warn("সংরক্ষিত পরীক্ষা খোলা যায়নি। একই ব্রাউজারের স্বাভাবিক উইন্ডোতে খুলুন।")}
setInterval(tick,500);
window.addEventListener("online",()=>{if(state?.stage==="done")void send();else void sendAttendance()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
</script>
</html>
